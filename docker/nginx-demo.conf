# Demo vhost for docker-compose.yml: writes real access/error logs into the shared demo-logs
# volume, so the monitor's log collector (and the log page) has something to read.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    access_log /var/log/demo/access.log;
    error_log /var/log/demo/error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
