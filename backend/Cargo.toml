[package]
name = "tsmonitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only side-channel server monitor with an AI ops advisor"

[[bin]]
name = "tsmonitor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
sysinfo = "0.40"
bollard = "0.21"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust-embed = "8"
mime_guess = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
schemars = "1"
mysql_async = { version = "0.37", default-features = false, features = ["minimal"] }
tokio-postgres = "0.7"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rlimit = "0.11"
libc = "0.2"
chacha20poly1305 = "0.11.0"
getrandom = "0.3"
base64 = "0.23.1"
url = "2.5.8"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "aws-lc-rs", "rustls-platform-verifier"] }
similar = "2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
